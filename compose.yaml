services:
  dongjiexi:
    build: .
    ports:
      - "8765:8765"
    environment:
      DONGJIEXI_CLOUD: "1"
      DONGJIEXI_OLLAMA_URL: "${DONGJIEXI_OLLAMA_URL:-http://127.0.0.1:11434}"
      DONGJIEXI_INFERENCE_PROVIDER: "${DONGJIEXI_INFERENCE_PROVIDER:-ollama}"
      DONGJIEXI_MODEL_API_BASE: "${DONGJIEXI_MODEL_API_BASE:-}"
      DONGJIEXI_MODEL_API_KEY: "${DONGJIEXI_MODEL_API_KEY:-}"
      DONGJIEXI_MODEL_ID: "${DONGJIEXI_MODEL_ID:-}"
      DONGJIEXI_MAX_CONCURRENT: "${DONGJIEXI_MAX_CONCURRENT:-2}"
      DONGJIEXI_OLLAMA_TOKEN: "${DONGJIEXI_OLLAMA_TOKEN:-}"
      DONGJIEXI_ACCESS_KEY: "${DONGJIEXI_ACCESS_KEY:-}"
      DONGJIEXI_ALLOWED_MODELS: "${DONGJIEXI_ALLOWED_MODELS:-${DONGJIEXI_MODEL_ID:-qwen3.5:4b}}"
      DONGJIEXI_ALLOWED_ORIGINS: "${DONGJIEXI_ALLOWED_ORIGINS:-}"
    restart: unless-stopped
