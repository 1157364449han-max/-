services:
  - type: web
    name: dongjiexi-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: DONGJIEXI_CLOUD
        value: "1"
      - key: DONGJIEXI_INFERENCE_PROVIDER
        value: chat-completions
      - key: DONGJIEXI_MODEL_API_BASE
        value: https://api.deepseek.com
      - key: DONGJIEXI_MODEL_ID
        value: deepseek-flash
      - key: DONGJIEXI_ALLOWED_MODELS
        value: deepseek-flash,deepseek-v4-pro
      - key: DONGJIEXI_MODEL_JSON_MODE
        value: json_object
      - key: DONGJIEXI_MODEL_API_KEY
        sync: false
      - key: DONGJIEXI_ACCESS_KEY
        sync: false
      - key: DONGJIEXI_ALLOWED_ORIGINS
        value: https://dongjiexi.github.io
      - key: DONGJIEXI_MAX_CONCURRENT
        value: "2"
      - key: DONGJIEXI_JOBS_PER_10_MINUTES
        value: "4"
